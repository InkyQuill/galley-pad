name: Build Release Installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to, for example v1.2.3.
        required: true
      sha:
        description: Exact commit expected for the release tag.
        required: true

permissions:
  contents: write

concurrency:
  group: build-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04

    steps:
      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          SEMVER_TAG_REGEX='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $SEMVER_TAG_REGEX ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify immutable release identity
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/check-release-version.mjs "${TAG#v}"

  linux:
    name: Linux deb/rpm/AppImage
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libfuse2t64 \
            patchelf \
            rpm

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux bundles
        run: bun run tauri -- build --bundles deb,rpm,appimage

      - name: Build Arch package
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          DEB_PATH="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_PATH" ]; then
            echo "Could not find a built Debian bundle." >&2
            exit 1
          fi

          DEB_SHA256="$(sha256sum "$DEB_PATH" | cut -d ' ' -f 1)"
          node scripts/update-aur-package.mjs "$VERSION" --sha256 "$DEB_SHA256"
          cp "$DEB_PATH" "packaging/aur/galley-pad-bin/galley-pad-bin-${VERSION}.deb"

          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -v "$PWD:/workspace" \
            -w /workspace/packaging/aur/galley-pad-bin \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              if ! getent group "$HOST_GID" >/dev/null; then
                groupadd -g "$HOST_GID" builder
              fi
              useradd -m -u "$HOST_UID" -g "$HOST_GID" builder
              su builder -c "makepkg --nodeps --noconfirm"
            '

      - name: Upload Linux installers
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            packaging/aur/galley-pad-bin/*.pkg.tar.zst

  windows:
    name: Windows exe
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows installer
        run: bun run tauri -- build --bundles nsis

      - name: Upload Windows installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS pkg (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build macOS app
        run: bun run tauri -- build --bundles app

      - name: Build macOS pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/build-macos-pkg.mjs --release --skip-app-build --version "$VERSION" --arch "${{ matrix.arch }}"

      - name: Upload macOS installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/pkg/*.pkg

  publish:
    needs: [validate, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Publish AUR package
        env:
          TAG: ${{ inputs.tag }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ vars.AUR_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping AUR publish."
            exit 0
          fi

          if [ -z "${AUR_SSH_KNOWN_HOSTS:-}" ]; then
            echo "AUR_SSH_KNOWN_HOSTS must contain a preverified AUR host key." >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          AUR_REPO="ssh://aur@aur.archlinux.org/galley-pad-bin.git"
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          node scripts/update-aur-package.mjs "$VERSION"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          if ! git clone "$AUR_REPO" "$WORK_DIR/aur"; then
            mkdir -p "$WORK_DIR/aur"
            git -C "$WORK_DIR/aur" init
            git -C "$WORK_DIR/aur" remote add origin "$AUR_REPO"
          fi
          cp packaging/aur/galley-pad-bin/PKGBUILD packaging/aur/galley-pad-bin/.SRCINFO "$WORK_DIR/aur/"

          cd "$WORK_DIR/aur"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package is already up to date."
            exit 0
          fi
          git commit -m "Update to ${VERSION}"
          git push origin HEAD:master
